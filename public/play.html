<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zombie Quiz Game</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #000000;
      font-family: 'Kanit', sans-serif;
      color: #ffffff;
      touch-action: none;
    }
    
    #gameContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-color: #121212;
      touch-action: none;
    }
    
    #gameCanvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background-color: #1e1e1e;
      touch-action: none;
    }

    #topBanner {
      position: relative;
      z-index: 10;
      width: 100%;
      background: rgba(18, 18, 18, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(0, 255, 136, 0.3);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .user-info {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zombie-count {
      background: rgba(0, 255, 136, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #00ff88;
      border: 1px solid #00ff88;
    }

    #bottomBanner {
      position: relative;
      z-index: 10;
      width: 100%;
      background: rgba(18, 18, 18, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-top: 2px solid rgba(255, 187, 0, 0.3);
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }

    .score-board {
      background: rgba(255, 187, 0, 0.15);
      padding: 8px 24px;
      border-radius: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffbb00;
      border: 1px solid #ffbb00;
      box-shadow: 0 0 12px rgba(255, 187, 0, 0.3);
    }

    #nameInputModal {
      display: flex;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 40;
      padding: 20px;
    }

    .input-box {
      background: #1e1e1e;
      border: 2px solid #00ff88;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
    }

    .input-box h2 {
      margin-bottom: 8px;
      color: #00ff88;
    }

    .input-box input {
      width: 100%;
      padding: 14px;
      margin: 18px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      touch-action: auto;
    }

    .input-box input:focus {
      border-color: #00ff88;
    }

    #startCountdownModal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    .btn-main {
      padding: 14px 36px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }

    .btn-main:active {
      transform: scale(0.95);
    }

    #startCountdownText {
      display: none;
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 15px #ffffff, 0 0 35px rgba(0, 255, 136, 0.9);
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    #startCountdownText.show {
      opacity: 1;
      display: block;
      animation: subtleShakeEffect 0.15s infinite alternate;
    }

    @keyframes subtleShakeEffect {
      0% { transform: scale(1.02) translate(0, 0); }
      50% { transform: scale(1.02) translate(1px, -1px); }
      100% { transform: scale(1.02) translate(-1px, 1px); }
    }

    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 35;
      padding: 15px;
    }
    
    .modal-content {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      width: 95%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      text-align: center;
      border: 2px solid #ff4444;
    }

    .btn-option {
      background-color: #3700b3;
      color: white;
      border: none;
      padding: 12px 16px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-align: left;
      line-height: 1.4;
      touch-action: manipulation;
    }

    .btn-option:active {
      background-color: #6200ee;
      transform: scale(0.97);
    }

    #timerText {
      font-size: 42px;
      color: #ffbb00;
      margin: 15px 0;
      font-weight: bold;
    }

    #result-box {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background-color: #2c2c2c;
      border-left: 4px solid #03dac6;
      border-radius: 4px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .btn-next {
      margin-top: 18px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #000;
      background: #00ff88;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
      touch-action: manipulation;
    }

    .btn-next:active {
      transform: scale(0.95);
    }

    .total-students-badge {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: bold;
      margin: 10px 0 15px 0;
      display: inline-block;
    }

    .ranking-list {
      width: 100%;
      margin-top: 10px;
      text-align: left;
    }

    .ranking-item {
      background: #2a2a2a;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #00ff88;
    }

    .ranking-bar-bg {
      width: 100%;
      background: #333;
      height: 10px;
      border-radius: 5px;
      margin-top: 6px;
      overflow: hidden;
    }

    .ranking-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #03dac6);
      width: 0%;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div id="topBanner">
      <div class="user-info">👤 ผู้เล่น: <span id="displayName">ยังไม่ระบุ</span></div>
      <div class="zombie-count">🧟 จัดการ: <span id="zombieCount">0</span> / 40</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="bottomBanner">
      <div class="score-board">⭐ คะแนน: <span id="scoreText">0</span></div>
    </div>

    <div id="nameInputModal">
      <div class="input-box">
        <h2>🎮 ต้อนรับผู้ลุยซอมบี้</h2>
        <p style="font-size: 0.9rem; color: #aaa;">กรุณากรอกชื่อ-นามสกุลก่อนเข้าสู่เกม</p>
        <input type="text" id="playerNameInput" placeholder="ระบุชื่อ - นามสกุลของคุณ" maxlength="40">
        <button class="btn-main" onclick="submitPlayerName()">ตกลง</button>
      </div>
    </div>

    <div id="startCountdownModal">
      <button id="btnStartGame" class="btn-main" onclick="initAndStartCinematic()">TAP TO START</button>
      <div id="startCountdownText">ARE YOU READY?</div>
    </div>

    <div id="quizModal" class="modal">
      <div class="modal-content">
        <h2 id="question-title">กำลังโหลดคำถาม...</h2>
        <div id="options-container"></div>
      </div>
    </div>

    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h2>🎉 กำลังประมวลผลผลลัพธ์...</h2>
        <p style="font-size: 0.9rem;">กรุณารอสักครู่ ระบบกำลังคำนวณตัวตนของคุณ</p>
        <div id="timerText">5</div>
        <div id="result-box"></div>
      </div>
    </div>

    <div id="rankingModal" class="modal">
      <div class="modal-content">
        <h2>📊 สถิติการเลือกสายเรียน</h2>
        <div class="total-students-badge">👨‍🎓 นักเรียนที่มาตอบทั้งหมด: <span id="totalStudentsText">0</span> คน</div>
        
        <div id="rankingContainer" class="ranking-list"></div>

        <button class="btn-next" onclick="location.reload()">🔄 เล่นใหม่อีกครั้ง</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });

    const socket = typeof io !== 'undefined' ? io() : null;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let W = 800;
    let H = 600;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      W = canvas.width;
      H = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);

    let audioCtx = null;
    let playerName = "";
    let score = 0;

    const audioElements = {
      ready: new Audio('audio/ready.mp3'),
      start: new Audio('audio/start.mp3'),
      shoot: new Audio('audio/shoot.mp3'),
      quiz: new Audio('audio/quiz.mp3')
    };

    audioElements.start.loop = true;
    audioElements.start.volume = 0.3;
    audioElements.quiz.loop = true;
    audioElements.quiz.volume = 0.5;

    function playSound(key) {
      const audio = audioElements[key];
      if (audio) {
        if (key === 'shoot') {
          const shootClone = audio.cloneNode();
          shootClone.volume = 0.5;
          shootClone.currentTime = 0;
          shootClone.play().catch(e => console.warn(e));
        } else {
          audio.currentTime = 0;
          audio.play().catch(e => console.warn(e));
        }
      }
      return audio;
    }

    function stopSound(key) {
      const audio = audioElements[key];
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
      }
    }

    function submitPlayerName() {
      const input = document.getElementById('playerNameInput').value.trim();
      if (!input) {
        alert("กรุณากรอกชื่อ-นามสกุลก่อนเริ่มเล่นเกมครับ!");
        return;
      }
      playerName = input;
      document.getElementById('displayName').innerText = playerName;
      document.getElementById('nameInputModal').style.display = 'none';
      document.getElementById('startCountdownModal').style.display = 'flex';
    }

    let gameStarted = false;
    let currentQuestionIndex = 0;
    let selectedTypes = [];

    const questions = [
    {
        title: "1. ถ้าครูให้เลือกทำโครงงานที่ต้องใช้เวลาหลายสัปดาห์ คุณอยากทำแบบใดมากที่สุด?",
        options: [
        { text: "A. ศึกษาปัญหาของคนในชุมชนและเสนอแนวทางแก้ไข", type: "ศิลป์-สังคม" },
        { text: "B. ทดลองหาคำตอบจากการเปลี่ยนตัวแปรต่าง ๆ", type: "วิทย์-คณิต" },
        { text: "C. สำรวจพฤติกรรมการซื้อของนักเรียนแล้วนำข้อมูลมาวิเคราะห์", type: "ศิลป์-คำนวณ" },
        { text: "D. สร้างชิ้นงานหรือผลิตภัณฑ์ที่สามารถนำไปใช้ได้จริง", type: "สายอาชีพ" },
        { text: "E. ศึกษาคำหรือวัฒนธรรมของประเทศที่สนใจ", type: "ศิลป์-ภาษา" }
        ]
    },
    {
        title: "2. เพื่อนในกลุ่มส่งข้อความมาว่า “ช่วยคิดวิธีนำเสนองานให้คนฟังสนใจหน่อย” คุณจะเลือกทำอะไร?",
        options: [
        { text: "A. ทำกราฟและตัวเลขให้เห็นข้อมูลชัดเจน", type: "ศิลป์-คำนวณ" },
        { text: "B. คิดเรื่องราวและประเด็นทางสังคมที่เชื่อมโยงกับหัวข้อ", type: "ศิลป์-สังคม" },
        { text: "C. ออกแบบและทำชิ้นงานประกอบการนำเสนอ", type: "สายอาชีพ" },
        { text: "D. คิดคำพูดหรือเรื่องราวให้น่าสนใจและเข้าใจง่าย", type: "ศิลป์-ภาษา" },
        { text: "E. อธิบายหลักการหรือข้อมูลทางวิทยาศาสตร์ที่เกี่ยวข้อง", type: "วิทย์-คณิต" }
        ]
    },
    {
        title: "3. ถ้าคุณได้รับเงิน 1,000 บาทเพื่อทำกิจกรรมที่ตัวเองสนใจ คุณจะนำไปทำอะไร?",
        options: [
        { text: "A. ซื้ออุปกรณ์ทดลองเพื่อหาคำตอบเกี่ยวกับสิ่งที่สงสัย", type: "วิทย์-คณิต" },
        { text: "B. ซื้อหนังสือหรือสื่อสำหรับเรียนภาษาใหม่", type: "ศิลป์-ภาษา" },
        { text: "C. ซื้อวัสดุเพื่อทำของใช้หรือผลิตภัณฑ์", type: "สายอาชีพ" },
        { text: "D. ซื้ออุปกรณ์เพื่อทำกราฟ ตาราง หรือวิเคราะห์ข้อมูล", type: "ศิลป์-คำนวณ" },
        { text: "E. ซื้อหนังสือเกี่ยวกับประวัติศาสตร์หรือเรื่องราวของสังคม", type: "ศิลป์-สังคม" }
        ]
    },
    {
        title: "4. ถ้าต้องเลือกหัวข้อหนึ่งเพื่อพูดหน้าชั้น คุณอยากพูดเรื่องใด?",
        options: [
        { text: "A. การเปลี่ยนแปลงของสภาพอากาศและผลต่อสิ่งมีชีวิต", type: "วิทย์-คณิต" },
        { text: "B. วัฒนธรรมและวิถีชีวิตของคนในประเทศต่าง ๆ", type: "ศิลป์-ภาษา" },
        { text: "C. ปัญหาที่เกิดขึ้นในชุมชนของเรา", type: "ศิลป์-สังคม" },
        { text: "D. การวางแผนรายรับรายจ่ายของวัยรุ่น", type: "ศิลป์-คำนวณ" },
        { text: "E. วิธีสร้างผลิตภัณฑ์ง่าย ๆ เพื่อสร้างรายได้", type: "สายอาชีพ" }
        ]
    },
    {
        title: "5. ถ้าครูให้ปัญหาว่า “โรงเรียนใช้ไฟฟ้ามากเกินไป” คุณอยากรับผิดชอบส่วนใด?",
        options: [
        { text: "A. สำรวจว่าพฤติกรรมของนักเรียนเกี่ยวข้องกับปัญหาอย่างไร", type: "ศิลป์-สังคม" },
        { text: "B. คำนวณค่าไฟและเปรียบเทียบข้อมูลแต่ละเดือน", type: "ศิลป์-คำนวณ" },
        { text: "C. ทดลองวิธีลดการใช้ไฟฟ้าและเก็บผลการทดลอง", type: "วิทย์-คณิต" },
        { text: "D. ออกแบบอุปกรณ์หรือวิธีช่วยลดการใช้ไฟ", type: "สายอาชีพ" },
        { text: "E. ทำสื่อประชาสัมพันธ์ให้คนเข้าใจและปฏิบัติตาม", type: "ศิลป์-ภาษา" }
        ]
    },
    {
        title: "6. ถ้าต้องทำงานกลุ่มกับเพื่อนที่มีความคิดเห็นต่างกัน คุณมักจะ…",
        options: [
        { text: "A. ใช้ข้อมูลและเหตุผลมาช่วยตัดสิน", type: "วิทย์-คณิต" },
        { text: "B. ช่วยพูดคุยให้ทุกคนเข้าใจกัน", type: "ศิลป์-ภาษา" },
        { text: "C. ทดลองแต่ละแนวทางแล้วดูผลที่เกิดขึ้น", type: "สายอาชีพ" },
        { text: "D. เปรียบเทียบข้อดีข้อเสียของแต่ละทางเลือก", type: "ศิลป์-คำนวณ" },
        { text: "E. พยายามหาวิธีที่นำไปทำได้จริง", type: "ศิลป์-สังคม" }
        ]
    },
    {
        title: "7. ถ้าคุณมีเวลาว่าง 3 ชั่วโมงหลังเลิกเรียน คุณมีแนวโน้มจะเลือกทำอะไร?",
        options: [
        { text: "A. ดูสารคดีเกี่ยวกับสังคม ประวัติศาสตร์ หรือเหตุการณ์ต่าง ๆ", type: "ศิลป์-สังคม" },

    // --- โครงสร้างระบบเกม (Game Engine & System Logic) ---
    let isCinematicActive = false;
    let cinematicTimer = 0;
    let player = { x: 0, y: 0, radius: 20, speed: 5, targetX: 0, targetY: 0 };
    let bullets = [];
    let zombies = [];
    let particles = [];
    let zombieTargetCount = 40; // ปรับเป้าหมายเป็น 40 ข้อ
    let currentZombieCount = 0;

    class Zombie {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 18;
        this.speed = 1.2 + Math.random() * 0.8;
        this.hp = 1;
      }

      update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
        }
      }

      draw() {
        ctx.save();
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#880000';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    }

    class Bullet {
      constructor(x, y, targetX, targetY) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.speed = 12;
        const dx = targetX - x;
        const dy = targetY - y;
        const dist = Math.hypot(dx, dy);
        this.vx = (dx / dist) * this.speed;
        this.vy = (dy / dist) * this.speed;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
      }

      draw() {
        ctx.save();
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.03;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initAndStartCinematic() {
      resizeCanvas();
      player.x = W / 2;
      player.y = H / 2;
      player.targetX = player.x;
      player.targetY = player.y;

      const btn = document.getElementById('btnStartGame');
      const text = document.getElementById('startCountdownText');
      btn.style.display = 'none';
      text.classList.add('show');

      playSound('ready');

      setTimeout(() => {
        document.getElementById('startCountdownModal').style.display = 'none';
        stopSound('ready');
        playSound('start');
        gameStarted = true;
        spawnZombies();
        requestAnimationFrame(gameLoop);
      }, 2000);
    }

    function spawnZombies() {
      zombies = [];
      for (let i = 0; i < 5; i++) {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if (side === 0) { x = Math.random() * W; y = -20; }
        else if (side === 1) { x = W + 20; y = Math.random() * H; }
        else if (side === 2) { x = Math.random() * W; y = H + 20; }
        else { x = -20; y = Math.random() * H; }
        zombies.push(new Zombie(x, y));
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!gameStarted) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      bullets.push(new Bullet(player.x, player.y, clickX, clickY));
      playSound('shoot');
    });

    function updateGame() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update();

        if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
          bullets.splice(i, 1);
          continue;
        }

        for (let j = zombies.length - 1; j >= 0; j--) {
          const z = zombies[j];
          const dist = Math.hypot(b.x - z.x, b.y - z.y);
          if (dist < b.radius + z.radius) {
            for (let p = 0; p < 8; p++) {
              particles.push(new Particle(z.x, z.y, '#ff4444'));
            }
            zombies.splice(j, 1);
            bullets.splice(i, 1);
            currentZombieCount++;
            score += 10;
            document.getElementById('zombieCount').innerText = currentZombieCount;
            document.getElementById('scoreText').innerText = score;

            if (zombies.length < 5) {
              const side = Math.floor(Math.random() * 4);
              let x, y;
              if (side === 0) { x = Math.random() * W; y = -20; }
              else if (side === 1) { x = W + 20; y = Math.random() * H; }
              else if (side === 2) { x = Math.random() * W; y = H + 20; }
              else { x = -20; y = Math.random() * H; }
              zombies.push(new Zombie(x, y));
            }

            triggerQuizModal();
            break;
          }
        }
      }

      zombies.forEach(z => z.update());

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function drawGame() {
      ctx.clearRect(0, 0, W, H);

      ctx.save();
      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      bullets.forEach(b => b.draw());
      zombies.forEach(z => z.draw());
      particles.forEach(p => p.draw());
    }

    function gameLoop() {
      if (gameStarted) {
        updateGame();
        drawGame();
        requestAnimationFrame(gameLoop);
      }
    }

    function triggerQuizModal() {
      gameStarted = false;
      stopSound('start');
      playSound('quiz');

      if (currentQuestionIndex >= questions.length) {
        calculateAndShowResult();
        return;
      }

      const q = questions[currentQuestionIndex];
      document.getElementById('question-title').innerText = q.title;
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });

      document.getElementById('quizModal').style.display = 'flex';
    }

    function selectOption(type) {
      selectedTypes.push(type);
      currentQuestionIndex++;
      document.getElementById('quizModal').style.display = 'none';
      stopSound('quiz');

      if (currentQuestionIndex >= questions.length || currentZombieCount >= zombieTargetCount) {
        calculateAndShowResult();
      } else {
        playSound('start');
        gameStarted = true;
        requestAnimationFrame(gameLoop);
      }
    }

    function calculateAndShowResult() {
      document.getElementById('quizModal').style.display = 'none';
      const resultModal = document.getElementById('resultModal');
      resultModal.style.display = 'flex';

      const typeCounts = {};
      selectedTypes.forEach(t => {
        typeCounts[t] = (typeCounts[t] || 0) + 1;
      });

      let maxCount = 0;
      let topType = "วิทย์-คณิต";
      for (const [t, count] of Object.entries(typeCounts)) {
        if (count > maxCount) {
          maxCount = count;
          topType = t;
        }
      }

      // ปรับเวลานับถอยหลังเป็น 5 วินาที
      let timeLeft = 5;
      const timerDisplay = document.getElementById('timerText');
      const resultBox = document.getElementById('result-box');
      timerDisplay.innerText = timeLeft;
      timerDisplay.style.display = 'block';
      resultBox.style.display = 'none';

      const countdown = setInterval(() => {
        timeLeft--;
        timerDisplay.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerDisplay.style.display = 'none';
          resultBox.style.display = 'block';
          resultBox.innerHTML = `
            <h3 style="color: #00ff88; margin-bottom: 8px;">🎯 สายเรียนที่เหมาะกับคุณ: ${topType}</h3>
            <p>คุณตอบคำถามตรงกับบุคลิกภาพสาย <b>${topType}</b> มากที่สุด!</p>
            <button class="btn-next" onclick="showRanking('${topType}')">ดูสถิติและลำดับจัดอันดับ 📊</button>
          `;
        }
      }, 1000);
    }

    function showRanking(userTopType) {
      document.getElementById('resultModal').style.display = 'none';
      const rankingModal = document.getElementById('rankingModal');
      rankingModal.style.display = 'flex';

      const container = document.getElementById('rankingContainer');
      container.innerHTML = '';

      // จำลองข้อมูลจำนวนนักเรียนที่มาตอบทั้งหมดตามแนวโน้มสายเรียน
      const mockStats = {
        "วิทย์-คณิต": 45,
        "ศิลป์-คำนวณ": 32,
        "ศิลป์-ภาษา": 28,
        "ศิลป์-สังคม": 18,
        "สายอาชีพ": 12
      };

      // คำนวณจำนวนนักเรียนทั้งหมดที่มาตอบ
      const totalStudents = Object.values(mockStats).reduce((a, b) => a + b, 0);
      document.getElementById('totalStudentsText').innerText = totalStudents.toLocaleString();

      // จัดลำดับสายเรียนที่มีคนตอบมากที่สุดไปน้อยที่สุด
      const sortedTypes = Object.keys(mockStats).sort((a, b) => mockStats[b] - mockStats[a]);

      sortedTypes.forEach((t, index) => {
        const count = mockStats[t];
        const percentage = ((count / totalStudents) * 100).toFixed(1);
        const isUserType = t === userTopType;
        
        const item = document.createElement('div');
        item.className = 'ranking-item';
        if (isUserType) item.style.borderLeftColor = '#ffbb00';

        item.innerHTML = `
          <div style="width: 100%;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 0.95rem;">
              <span>อันดับ ${index + 1}. ${t} ${isUserType ? '⭐ (ของคุณ)' : ''}</span>
              <span style="color: #00ff88;">${count} คน (${percentage}%)</span>
            </div>
            <div class="ranking-bar-bg">
              <div class="ranking-bar-fill" style="width: ${percentage}%;"></div>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
