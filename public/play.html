<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zombie Quiz Game</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #000000;
      font-family: 'Kanit', sans-serif;
      color: #ffffff;
      touch-action: none;
    }
    
    #gameContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-color: #121212;
      touch-action: none;
    }
    
    #gameCanvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background-color: #1e1e1e;
      touch-action: none;
    }

    #topBanner {
      position: relative;
      z-index: 10;
      width: 100%;
      background: rgba(18, 18, 18, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(0, 255, 136, 0.3);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .user-info {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zombie-count {
      background: rgba(0, 255, 136, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #00ff88;
      border: 1px solid #00ff88;
    }

    #bottomBanner {
      position: relative;
      z-index: 10;
      width: 100%;
      background: rgba(18, 18, 18, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-top: 2px solid rgba(255, 187, 0, 0.3);
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }

    .score-board {
      background: rgba(255, 187, 0, 0.15);
      padding: 8px 24px;
      border-radius: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffbb00;
      border: 1px solid #ffbb00;
      box-shadow: 0 0 12px rgba(255, 187, 0, 0.3);
    }

    #nameInputModal {
      display: flex;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 40;
      padding: 20px;
    }

    .input-box {
      background: #1e1e1e;
      border: 2px solid #00ff88;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
    }

    .input-box h2 {
      margin-bottom: 8px;
      color: #00ff88;
    }

    .input-box input {
      width: 100%;
      padding: 14px;
      margin: 18px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      touch-action: auto;
    }

    .input-box input:focus {
      border-color: #00ff88;
    }

    #startCountdownModal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    .btn-main {
      padding: 14px 36px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }

    .btn-main:active {
      transform: scale(0.95);
    }

    #startCountdownText {
      display: none;
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 15px #ffffff, 0 0 35px rgba(0, 255, 136, 0.9);
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    #startCountdownText.show {
      opacity: 1;
      display: block;
      animation: subtleShakeEffect 0.15s infinite alternate;
    }

    @keyframes subtleShakeEffect {
      0% { transform: scale(1.02) translate(0, 0); }
      50% { transform: scale(1.02) translate(1px, -1px); }
      100% { transform: scale(1.02) translate(-1px, 1px); }
    }

    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 35;
      padding: 15px;
    }
    
    .modal-content {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      width: 95%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      text-align: center;
      border: 2px solid #ff4444;
    }

    .btn-option {
      background-color: #3700b3;
      color: white;
      border: none;
      padding: 12px 16px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-align: left;
      line-height: 1.4;
      touch-action: manipulation;
    }

    .btn-option:active {
      background-color: #6200ee;
      transform: scale(0.97);
    }

    #timerText {
      font-size: 36px;
      color: #ffbb00;
      margin: 15px 0;
      font-weight: bold;
    }

    #result-box {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background-color: #2c2c2c;
      border-left: 4px solid #03dac6;
      border-radius: 4px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* สไตล์เพิ่มเติมปุ่ม NEXT และหน้า Ranking */
    .btn-next {
      margin-top: 18px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #000;
      background: #00ff88;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
      touch-action: manipulation;
    }

    .btn-next:active {
      transform: scale(0.95);
    }

    .ranking-list {
      width: 100%;
      margin-top: 15px;
      text-align: left;
    }

    .ranking-item {
      background: #2a2a2a;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #00ff88;
    }

    .ranking-bar-bg {
      width: 100%;
      background: #333;
      height: 10px;
      border-radius: 5px;
      margin-top: 6px;
      overflow: hidden;
    }

    .ranking-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #03dac6);
      width: 0%;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div id="topBanner">
      <div class="user-info">👤 ผู้เล่น: <span id="displayName">ยังไม่ระบุ</span></div>
      <div class="zombie-count">🧟 จัดการ: <span id="zombieCount">0</span> / 20</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="bottomBanner">
      <div class="score-board">⭐ คะแนน: <span id="scoreText">0</span></div>
    </div>

    <div id="nameInputModal">
      <div class="input-box">
        <h2>🎮 ต้อนรับผู้ลุยซอมบี้</h2>
        <p style="font-size: 0.9rem; color: #aaa;">กรุณากรอกชื่อ-นามสกุลก่อนเข้าสู่เกม</p>
        <input type="text" id="playerNameInput" placeholder="ระบุชื่อ - นามสกุลของคุณ" maxlength="40">
        <button class="btn-main" onclick="submitPlayerName()">ตกลง</button>
      </div>
    </div>

    <div id="startCountdownModal">
      <button id="btnStartGame" class="btn-main" onclick="initAndStartCinematic()">TAP TO START</button>
      <div id="startCountdownText">ARE YOU READY?</div>
    </div>

    <div id="quizModal" class="modal">
      <div class="modal-content">
        <h2 id="question-title">กำลังโหลดคำถาม...</h2>
        <div id="options-container"></div>
      </div>
    </div>

    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h2>🎉 กำลังประมวลผลผลลัพธ์...</h2>
        <p style="font-size: 0.9rem;">กรุณารอสักครู่ ระบบกำลังคำนวณตัวตนของคุณ</p>
        <div id="timerText">10</div>
        <div id="result-box"></div>
      </div>
    </div>

    <div id="rankingModal" class="modal">
      <div class="modal-content">
        <h2>📊 สถิติการเลือกสายเรียน</h2>
        <p style="font-size: 0.85rem; color: #aaa; margin-top: 4px;">สรุปผลอันดับสายเรียนที่ถูกเลือกมากที่สุด</p>
        
        <div id="rankingContainer" class="ranking-list"></div>

        <button class="btn-next" onclick="location.reload()">🔄 เล่นใหม่อีกครั้ง</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });

    const socket = typeof io !== 'undefined' ? io() : null;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let W = 800;
    let H = 600;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      W = canvas.width;
      H = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);

    let audioCtx = null;
    let playerName = "";
    let score = 0;

    const audioElements = {
      ready: new Audio('audio/ready.mp3'),
      start: new Audio('audio/start.mp3'),
      shoot: new Audio('audio/shoot.mp3'),
      quiz: new Audio('audio/quiz.mp3')
    };

    audioElements.start.loop = true;
    audioElements.start.volume = 0.3;
    audioElements.quiz.loop = true;
    audioElements.quiz.volume = 0.5;

    function playSound(key) {
      const audio = audioElements[key];
      if (audio) {
        if (key === 'shoot') {
          const shootClone = audio.cloneNode();
          shootClone.volume = 0.5;
          shootClone.currentTime = 0;
          shootClone.play().catch(e => console.warn(e));
        } else {
          audio.currentTime = 0;
          audio.play().catch(e => console.warn(e));
        }
      }
      return audio;
    }

    function stopSound(key) {
      const audio = audioElements[key];
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
      }
    }

    function submitPlayerName() {
      const input = document.getElementById('playerNameInput').value.trim();
      if (!input) {
        alert("กรุณากรอกชื่อ-นามสกุลก่อนเริ่มเล่นเกมครับ!");
        return;
      }
      playerName = input;
      document.getElementById('displayName').innerText = playerName;
      document.getElementById('nameInputModal').style.display = 'none';
      document.getElementById('startCountdownModal').style.display = 'flex';
    }

    let gameStarted = false;
    let currentQuestionIndex = 0;
    let selectedTypes = [];

    const questions = [
      { title: "1. วันหยุดสุดสัปดาห์ คุณอยากทำอะไรมากที่สุด!?", options: [{ text: "ไปเที่ยวต่างจังหวัด / ตั้งแคมป์", type: "สายลุย ชอบธรรมชาติและการผจญภัย" }, { text: "นอนดูซีรีส์อยู่ห้องชิลๆ", type: "สายสโลว์ไลฟ์ รักความสงบ" }, { text: "ไปเดินห้าง ช้อปปิ้ง หาคาเฟ่เก๋ๆ", type: "สายแฟชั่น ชอบความทันสมัย" }] },
      { title: "2. เวลาเจอเรื่องเครียด คุณเลือกวิธีไหนในการฮีลใจ?", options: [{ text: "กินของอร่อยๆ ที่ชอบ", type: "นักชิม ใช้ความอร่อยเยียวยา" }, { text: "ออกกำลังกาย / เล่นกีฬา", type: "สายแอคทีฟ ปลดปล่อยพลังงาน" }, { text: "คุยกับเพื่อนสนิท / ระบายให้คนอื่นฟัง", type: "สายเอ็กโทรเวิร์ต รักมิตรภาพ" }] },
      { title: "3. อาหารมื้อเย็นที่คู่ควรกับคุณคืออะไร?", options: [{ text: "ชาบู / หมูกระทะ", type: "สายปาร์ตี้ ชอบกินจัดเต็ม" }, { text: "สลัด / อาหารคลีนเพื่อสุขภาพ", type: "สายเฮลตี้ ใส่ใจสุขภาพ" }, { text: "อาหารตามสั่งง่ายๆ รวดเร็ว", type: "สายยุทธศาสตร์ เน้นความคล่องตัว" }] },
      { title: "4. เมื่อต้องทำงานเป็นกลุ่ม คุณมักจะรับบทบาทไหน?", options: [{ text: "ผู้นำ / คนคอยแจกจ่ายงาน", type: "สายลีดเดอร์ ชอบบริหาร" }, { text: "คนคิดไอเดีย / ออกแบบงาน", type: "สายคริเอทีฟ ความคิดสร้างสรรค์สูง" }, { text: "ฝ่ายหาข้อมูล / คอยสนับสนุนเพื่อน", type: "สายซัพพอร์ต ละเอียดรอบคอบ" }] },
      { title: "5. เครื่องดื่มแก้วโปรดช่วงเช้าของคุณคือ?", options: [{ text: "กาแฟดำ / อเมริกาโน่", type: "สายจริงจัง พร้อมลุยงาน" }, { text: "ชาไข่มุก / นมสดหวานร้อย", type: "สายสดใส เติมความหวาน" }, { text: "น้ำผลไม้สกัด / น้ำเปล่าเย็นๆ", type: "สายรักตัวเอง เน้นความสดชื่น" }] },
      { title: "6. ถ้าชนะรางวัลใหญ่ คุณจะเอาเงินไปทำอะไรก่อน?", options: [{ text: "ลงทุน / เก็บออมในธนาคาร", type: "สายวางแผนอนาคต มั่นคง" }, { text: "ตั๋วเครื่องบินไปเที่ยวรอบโลก", type: "สายรักอิสระ เปิดโลกทัศน์" }, { text: "ซื้อมือถือใหม่ / ของที่อยากได้", type: "สายรางวัลชีวิต ให้ความสุขปัจจุบัน" }] },
      { title: "7. สไตล์การแต่งตัวที่คุณชอบที่สุด?", options: [{ text: "เสื้อยืด กางเกงยีนส์ สบายๆ", type: "สายมินิมอล เน้นความสะดวก" }, { text: "จัดเต็มตามเทรนด์แฟชั่นล่าสุด", type: "สายโดดเด่น มั่นใจสูง" }, { text: "ชุดทางการ / เนี๊ยบเรียบร้อย", type: "สายมืออาชีพ ดูน่าเชื่อถือ" }] },
      { title: "8. เวลาไปเที่ยว คุณชอบพักที่ไหนมากที่สุด?", options: [{ text: "โรงแรม 5 ดาว สิ่งอำนวยความสะดวกครบ", type: "สายลักชัวรี ชอบความสบาย" }, { text: "โฮมสเตย์สัมผัสวิถีชาวบ้าน", type: "สายอินดี้ ชอบเรียนรู้ culture" }, { text: "พูลวิลล่าปาร์ตี้กับกลุ่มเพื่อน", type: "สายกิจกรรม ชอบความสนุกสนาน" }] },
      { title: "9. แนวเพลงที่คุณเปิดฟังบ่อยที่สุด?", options: [{ text: "Pop / K-Pop ฟังง่าย จังหวะสนุก", type: "สายสดใส ทันกระแส" }, { text: "Lo-fi / Acoustic ฟังสบาย", type: "สายมีสมาธิ ชอบความสงบ" }, { text: "Rock / Hip-Hop จังหวะหนักแน่น", type: "สายพลังเยอะ มีแพสชัน" }] },
      { title: "10. เวลาต้องตัดสินใจเรื่องสำคัญ คุณใช้อะไรนำทาง?", options: [{ text: "เหตุผล ข้อมูล และสถิติ", type: "สายตรรกะ คิดเป็นระบบ" }, { text: "ความรู้สึกแรก / สัญชาตญาณ", type: "สายอาร์ต เชื่อในความรู้สึก" }, { text: "ปรึกษาและฟังความเห็นจากคนรอบข้าง", type: "สายประตินิยม ใส่ใจผู้อื่น" }] },
      { title: "11. โซเชียลมีเดียที่คุณเล่นบ่อยที่สุดคือ?", options: [{ text: "TikTok / Reels (คลิปสั้น)", type: "สายบันเทิง ชอบความรวดเร็ว" }, { text: "Instagram (คุมโทนรูปสวยๆ)", type: "สายสร้างสรรค์ ชอบเสพศิลปะ" }, { text: "X (Twitter) / Facebook", type: "สายทันโลก ติดตามข่าวสาร" }] },
      { title: "12. สัตว์เลี้ยงประเภทไหนที่เป็นตัวแทนของคุณ?", options: [{ text: "สุนัข (ซื่อสัตย์ ร่าเริง)", type: "สายเฟรนด์ลี่ เป็นมิตร" }, { text: "แมว (เป็นตัวของตัวเอง อินดี้)", type: "สายลึกลับ รักอิสระ" }, { text: "คาปิบาร่า (สโลว์ไลฟ์)", type: "สายชิลขั้นสุด" }] },
      { title: "13. คุณคิดอย่างไรกับการนัดหมาย?", options: [{ text: "ไปถึงก่อนเวลาเสมอ 10-15 นาที", type: "สายตรงต่อเวลา รับผิดชอบสูง" }, { text: "ไปถึงตรงเวลาเป๊ะพอดี", type: "สายจัดการเวลาดีเยี่ยม" }, { text: "สายเลทนิดหน่อย 5-10 นาที", type: "สายยืดหยุ่น" }] },
      { title: "14. วิธีจัดการกับของเสีย/ของไม่ได้ใช้ในบ้าน?", options: [{ text: "ตัดใจทิ้งทันที / บริจาคให้หมด", type: "สายเด็ดขาด ชอบความสะอาด" }, { text: "เก็บไว้ก่อน เผื่อได้ใช้ในอนาคต", type: "สายช่างเสียดาย คุ้มค่า" }, { text: "เอามา DIY ดัดแปลงเป็นของใหม่", type: "สายช่างคิด ชอบประดิษฐ์" }] },
      { title: "15. สภาพอากาศแบบไหนที่คุณชอบที่สุด?", options: [{ text: "อากาศหนาว มีหมอก เย็นสบาย", type: "สายโรแมนติก ชอบความอบอุ่น" }, { text: "แดดจัด ฟ้าใส สดใส", type: "สายแอคทีฟ ชอบกิจกรรม" }, { text: "ฝนตกพรำๆ นั่งฟังเสียงฝน", type: "สายลึกซึ้ง ชอบจินตนาการ" }] },
      { title: "16. เวลาไปซูเปอร์มาร์เก็ต คุณมีพฤติกรรมอย่างไร?", options: [{ text: "จดลิสต์มาจากบ้าน เดินซื้อตามลิสต์", type: "สายเป้าหมายชัดเจน" }, { text: "เดินดูไปเรื่อยๆ เจออะไรน่ากินค่อยหยิบ", type: "สายชอบความประหลาดใจ" }, { text: "เปรียบเทียบราคา ป้ายลดราคา", type: "สายฉลาดใช้เงิน" }] },
      { title: "17. ถ้าเลือกซูเปอร์เพาเวอร์ได้ 1 อย่าง คุณอยากได้อะไร?", options: [{ text: "อ่านใจคนอื่นได้", type: "สายจิตวิทยา เข้าใจผู้อื่น" }, { text: "วาร์ปไปไหนก็ได้ทันที", type: "สายรักความสะดวก ไว" }, { text: "ย้อนเวลาไปแก้ไขอดีตได้", type: "สายพิถีพิถัน สมบูรณ์แบบ" }] },
      { title: "18. ในงานปาร์ตี้ คุณมักจะอยู่ตรงไหนของงาน?", options: [{ text: "ใจกลางงาน สนุกสนานกับทุกคน", type: "สายดาวเด่น สร้างสีสัน" }, { text: "มุมเงียบๆ คุยกับเพื่อนสนิท 1-2 คน", type: "สายเน้นคุณภาพมิตรภาพ" }, { text: "ยืนอยู่ใกล้ๆ โซนอาหารและเครื่องดื่ม", type: "สายโฟกัสความสุขการกิน" }] },
      { title: "19. คุณใช้วิธีไหนในการตั้งเป้าหมายชีวิต?", options: [{ text: "เขียนแผนงาน 1 ปี, 5 ปี ชัดเจน", type: "สายมุ่งมั่น วิสัยทัศน์สูง" }, { text: "ตั้งเป้าหมายสั้นๆ ทำทีละวัน", type: "สายโฟกัสปัจจุบัน" }, { text: "ปล่อยให้ชีวิตไหลไปตามโอกาส", type: "สายยืดหยุ่น ปรับตัวเก่ง" }] },
      { title: "20. คุณอยากให้คนอื่นจดจำคุณในฐานะคนแบบไหน?", options: [{ text: "คนเก่ง ประสบความสำเร็จ พึ่งพาได้", type: "สายสร้างผลงาน ทะเยอทะยาน" }, { text: "คนใจดี อยู่ด้วยแล้วมีความสุข", type: "สายสร้างพลังบวก" }, { text: "คนตลก อารมณ์ดี สร้างเสียงหัวเราะ", type: "สายเอนเตอร์เทนเนอร์" }] }
    ];

    const zombieImages = [new Image(), new Image(), new Image(), new Image()];
    zombieImages.forEach((img, i) => {
      img.src = `images/zombie${i+1}.png`;
    });

    let targetCrosshair = null;
    let isQuizActive = false;
    let cannonBalls = [];
    let particles = [];
    let cannonAngle = 0;
    let muzzleFlash = 0;

    const fireflies = Array.from({ length: 25 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H * 0.8,
      r: Math.random() * 3 + 1,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    }));

    const zombieSpecs = [
      { imgIndex: 0, w: 75, h: 95,  speed: 5.5 },
      { imgIndex: 1, w: 60, h: 75,  speed: 5.5 },
      { imgIndex: 2, w: 105, h: 120, speed: 5.5 },
      { imgIndex: 3, w: 80, h: 105, speed: 5.5 }
    ];

    function getRandomZombie(laneY, extraDelay = 0) {
      const spec = zombieSpecs[Math.floor(Math.random() * zombieSpecs.length)];
      return {
        imgIndex: spec.imgIndex,
        x: W + extraDelay + Math.random() * 150,
        y: laneY - spec.h * 0.5,
        baseY: laneY - spec.h * 0.5,
        w: spec.w,
        h: spec.h,
        speed: spec.speed,
        alive: true
      };
    }

    function spawnZombie() {
      const lanes = [H * 0.46, H * 0.58, H * 0.70, H * 0.80];
      zombies.push(getRandomZombie(lanes[Math.floor(Math.random() * lanes.length)], 0));
    }

    let zombies = [];

    function initZombies() {
      zombies = [
        getRandomZombie(H * 0.46, 0),
        getRandomZombie(H * 0.58, 80),
        getRandomZombie(H * 0.58, 300),
        getRandomZombie(H * 0.70, 0),
        getRandomZombie(H * 0.70, 220),
        getRandomZombie(H * 0.80, 150)
      ];
    }

    function initAndStartCinematic() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      document.getElementById('btnStartGame').style.display = 'none';
      playSound('start');

      const el = document.getElementById('startCountdownText');
      el.classList.add('show');

      const audioReady = playSound('ready');

      const startGameAction = () => {
        document.getElementById('startCountdownModal').style.display = 'none';
        gameStarted = true;
      };

      if (audioReady) {
        audioReady.onended = startGameAction;
        const durationMs = (audioReady.duration && !isNaN(audioReady.duration)) ? audioReady.duration * 1000 : 1800;
        setTimeout(() => {
          if (!gameStarted) startGameAction();
        }, durationMs);
      } else {
        setTimeout(startGameAction, 1800);
      }
    }

    function drawCemeteryBackground() {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#0a1526');
      skyGrad.addColorStop(0.6, '#132a4a');
      skyGrad.addColorStop(1, '#1b3b5a');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      const moonX = W * 0.82;
      const moonY = H * 0.22;
      const moonRadius = 40;

      const moonGlow = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.8, moonX, moonY, moonRadius * 2.5);
      moonGlow.addColorStop(0, 'rgba(255, 255, 220, 0.8)');
      moonGlow.addColorStop(0.5, 'rgba(255, 255, 180, 0.2)');
      moonGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath(); ctx.arc(moonX, moonY, moonRadius * 2.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#fffae6';
      ctx.beginPath(); ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#17301c';
      ctx.beginPath();
      ctx.moveTo(0, H * 0.55);
      ctx.quadraticCurveTo(W * 0.25, H * 0.48, W * 0.5, H * 0.53);
      ctx.quadraticCurveTo(W * 0.75, H * 0.58, W, H * 0.5);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

      ctx.fillStyle = '#0f2113';
      ctx.beginPath();
      ctx.moveTo(0, H * 0.65);
      ctx.quadraticCurveTo(W * 0.4, H * 0.58, W * 0.7, H * 0.64);
      ctx.quadraticCurveTo(W * 0.85, H * 0.67, W, H * 0.62);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

      fireflies.forEach(f => {
        f.alpha += f.speed;
        if (f.alpha > 1 || f.alpha < 0) f.speed = -f.speed;
        ctx.fillStyle = `rgba(186, 255, 41, ${Math.max(0, f.alpha)})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawCannon() {
      const baseX = 40;
      const baseY = H * 0.85;

      ctx.save();
      ctx.translate(baseX, baseY);
      ctx.save();
      ctx.rotate(cannonAngle);

      const metalGrad = ctx.createLinearGradient(0, -15, 0, 15);
      metalGrad.addColorStop(0, '#718093');
      metalGrad.addColorStop(0.5, '#2f3640');
      metalGrad.addColorStop(1, '#1e272e');
      ctx.fillStyle = metalGrad;
      ctx.fillRect(0, -12, 60, 24);

      if (muzzleFlash > 0) {
        ctx.fillStyle = '#ff9f43';
        ctx.beginPath(); ctx.arc(70, 0, 15, 0, Math.PI * 2); ctx.fill();
        muzzleFlash--;
      }
      ctx.restore();

      ctx.fillStyle = '#535c68';
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function createExplosion(x, y) {
      if (particles.length > 60) {
        particles.splice(0, 20);
      }

      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          radius: Math.random() * 4 + 2,
          color: ['#ff4757', '#ffa502', '#badc58', '#ffffff'][Math.floor(Math.random() * 4)],
          life: 15
        });
      }
    }

    function drawZombies() {
      zombies.forEach((z, idx) => {
        if (!z.alive) return;
        if (gameStarted) z.x -= z.speed;

        if (z.x < -100) {
          zombies[idx] = getRandomZombie(z.baseY + z.h * 0.5);
          return;
        }

        const img = zombieImages[z.imgIndex];
        if (img) {
          ctx.drawImage(img, z.x, z.y, z.w, z.h);
        }
      });
    }

    function drawCrosshair() {
      if (!targetCrosshair) return;
      ctx.strokeStyle = '#ff4757';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(targetCrosshair.x, targetCrosshair.y, 15, 0, Math.PI * 2); ctx.stroke();
    }

    function updateScoreDisplay() {
      document.getElementById('scoreText').innerText = score;
    }

    let lastShootTime = 0;
    const SHOOT_COOLDOWN = 120;

    function handlePointer(e) {
      if (!gameStarted || isQuizActive) return;

      const now = Date.now();
      if (now - lastShootTime < SHOOT_COOLDOWN) {
        return;
      }
      lastShootTime = now;

      playSound('shoot');

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      targetCrosshair = { x: clickX, y: clickY };

      const startX = 40;
      const startY = H * 0.85;
      
      cannonAngle = Math.atan2(clickY - startY, clickX - startX);
      muzzleFlash = 4;

      let hit = zombies.find(z => z.alive && 
        clickX >= z.x && clickX <= z.x + z.w &&
        clickY >= z.y && clickY <= z.y + z.h
      );

      const speed = 20;

      if (cannonBalls.length > 10) cannonBalls.shift();

      cannonBalls.push({
        x: startX, y: startY,
        vx: Math.cos(cannonAngle) * speed,
        vy: Math.sin(cannonAngle) * speed,
        tx: clickX, ty: clickY,
        hit: hit
      });
    }

    canvas.addEventListener('pointerdown', handlePointer);

    function gameLoop() {
      ctx.clearRect(0, 0, W, H);

      drawCemeteryBackground();
      drawCannon();
      drawZombies();

      cannonBalls.forEach((b, index) => {
        b.x += b.vx;
        b.y += b.vy;

        ctx.fillStyle = '#ffbb00';
        ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill();

        if (Math.hypot(b.x - b.tx, b.y - b.ty) < 15) {
          cannonBalls.splice(index, 1);
          targetCrosshair = null;
          createExplosion(b.tx, b.ty);

          if (b.hit) {
            score += 5;
            updateScoreDisplay();

            b.hit.alive = false;
            setTimeout(showQuiz, 200);
          } else {
            score = Math.max(0, score - 1);
            updateScoreDisplay();
          }
        }
      });

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        if (p.life <= 0) particles.splice(index, 1);
      });

      drawCrosshair();
      requestAnimationFrame(gameLoop);
    }

    function showQuiz() {
      isQuizActive = true;

      const q = questions[currentQuestionIndex];
      document.getElementById('question-title').innerText = q.title;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });

      document.getElementById('quizModal').style.display = 'flex';
    }

    function selectOption(type) {
      selectedTypes.push(type);
      document.getElementById('quizModal').style.display = 'none';

      currentQuestionIndex++;
      document.getElementById('zombieCount').innerText = currentQuestionIndex;

      if (currentQuestionIndex < 20) {
        isQuizActive = false;
        spawnZombie();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      isQuizActive = true;

      stopSound('start');
      playSound('quiz');

      document.getElementById('resultModal').style.display = 'flex';

      let timeLeft = 10;
      const timerEl = document.getElementById('timerText');

      const countdown = setInterval(() => {
        timeLeft--;
        timerEl.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          showFinalResult();
        }
      }, 1000);
    }

    function showFinalResult() {
      document.getElementById('timerText').style.display = 'none';

      const counts = {};
      selectedTypes.forEach(t => { counts[t] = (counts[t] || 0) + 1; });

      let topType = "";
      let maxCount = 0;
      for (let t in counts) {
        if (counts[t] > maxCount) {
          maxCount = counts[t];
          topType = t;
        }
      }

      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <h3 style="margin-top:0; color:#03dac6; font-size:1.1rem;">💡 ไลฟ์สไตล์ที่เหมาะสมกับคุณคือ: ${topType}</h3>
        <p style="margin-bottom:5px; font-size:0.95rem;">👤 <strong>ผู้เล่น:</strong> ${playerName}</p>
        <p style="margin-bottom:5px; font-size:0.95rem;">⭐ <strong>คะแนนยิงปืนรวม:</strong> ${score} คะแนน</p>
        <p style="margin-bottom:0; font-size:0.85rem; color:#aaa;">คุณได้ตอบคำถามครบทั้ง 20 ข้อเรียบร้อยแล้ว!</p>

        <div style="text-align: center;">
          <button class="btn-next" onclick="showRankingPage()">NEXT ➔</button>
        </div>
      `;

      if (socket) {
        socket.emit('submitAnswer', { 
          playerName: playerName,
          score: score,
          optionText: topType 
        });
      }
    }

    // ฟังก์ชันสำหรับสลับไปหน้าจัดอันดับสถิติสายเรียน
    function showRankingPage() {
      document.getElementById('resultModal').style.display = 'none';

      // จำลองข้อมูลสถิติ
      const mockData = [
        { name: "🔬 สายวิทย์-คณิต", count: 45, color: "#ff4757" },
        { name: "🛠️ สายอาชีพ", count: 32, color: "#ffa502" },
        { name: "🎨 สายศิลป์", count: 28, color: "#2ed573" },
        { name: "🗣️ สายภาษา", count: 19, color: "#1e90ff" }
      ];

      const total = mockData.reduce((acc, cur) => acc + cur.count, 0);

      const container = document.getElementById('rankingContainer');
      container.innerHTML = '';

      mockData.forEach(item => {
        const percent = Math.round((item.count / total) * 100);
        const div = document.createElement('div');
        div.className = 'ranking-item';
        div.style.borderLeftColor = item.color;
        div.innerHTML = `
          <div style="width: 100%;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:0.95rem;">
              <span>${item.name}</span>
              <span style="color:${item.color}">${percent}% (${item.count} คน)</span>
            </div>
            <div class="ranking-bar-bg">
              <div class="ranking-bar-fill" style="width: ${percent}%; background: ${item.color};"></div>
            </div>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('rankingModal').style.display = 'flex';
    }

    resizeCanvas();
    initZombies();
    gameLoop();
  </script>
</body>
</html>
