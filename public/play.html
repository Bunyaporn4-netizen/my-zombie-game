<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Quiz Game - Play</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 800px;
      height: 600px;
    }
    canvas {
      border: 3px solid #ff4444;
      background-color: #1e1e1e;
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.4);
      border-radius: 12px;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #00ff88;
      border: 1px solid #00ff88;
      pointer-events: none;
    }
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 10;
      border-radius: 12px;
    }
    .modal-content {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      text-align: center;
      border: 2px solid #ff4444;
    }
    h2 {
      margin-top: 0;
      color: #bb86fc;
      font-size: 1.3rem;
    }
    .btn-option {
      background-color: #3700b3;
      color: white;
      border: none;
      padding: 14px 20px;
      margin: 10px 0;
      width: 100%;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-align: left;
    }
    .btn-option:hover {
      background-color: #6200ee;
    }
    .btn-option:active {
      transform: scale(0.98);
    }
    .btn-option:disabled {
      background-color: #444;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #result-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #2c2c2c;
      border-left: 4px solid #03dac6;
      border-radius: 4px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #333;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div id="hud">🧟 ซอมบี้ที่จัดการ: <span id="zombieCount">0</span> / 20</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- ป๊อปอัปคำถาม -->
    <div id="quizModal" class="modal">
      <div class="modal-content">
        <h2 id="question-title">รอเริ่มเกม...</h2>
        <div id="options-container"></div>
        <div id="result-box" class="hidden"></div>
      </div>
    </div>

    <!-- ป๊อปอัปสรุปผลลัพธ์เมื่อครบ 20 ข้อ -->
    <div id="finalModal" class="modal">
      <div class="modal-content">
        <h2>สรุปผลอันดับคำตอบยอดนิยม</h2>
        <div id="ranking-container"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const questionTitle = document.getElementById('question-title');
    const optionsContainer = document.getElementById('options-container');
    const resultBox = document.getElementById('result-box');
    const quizModal = document.getElementById('quizModal');
    const finalModal = document.getElementById('finalModal');
    const rankingContainer = document.getElementById('ranking-container');

    let currentQuestionData = null;
    let answeredCount = 0;
    let isQuizActive = false;

    // ตัวละคร และ ซอมบี้
    const player = { x: 400, y: 500, size: 20, speed: 5, color: '#00ff88' };
    let bullets = [];
    let currentZombie = null;

    const keys = {};
    let mousePos = { x: 0, y: 0 };

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    canvas.addEventListener('click', () => {
      if (!isQuizActive && answeredCount < 20) {
        const angle = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);
        bullets.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(angle) * 10,
          vy: Math.sin(angle) * 10
        });
      }
    });

    function spawnZombie() {
      if (answeredCount < 20) {
        currentZombie = {
          x: Math.random() * (canvas.width - 100) + 50,
          y: Math.random() * (canvas.height / 2) + 50,
          size: 25,
          color: '#ff4444'
        };
      } else {
        currentZombie = null;
      }
    }

    spawnZombie();

    // 1. รับคำถามจาก Server
    socket.on('newQuestion', (question) => {
      currentQuestionData = question;
      resultBox.classList.add('hidden');
      resultBox.innerText = '';
      optionsContainer.innerHTML = '';
      
      questionTitle.innerText = question.title;

      question.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });
    });

    // 2. เมื่อยิงซอมบี้โดน ให้เปิด Pop-up คำถาม
    function showQuiz() {
      isQuizActive = true;
      quizModal.style.display = 'flex';
    }

    // 3. เมื่อกดเลือกคำตอบ
    function selectOption(index) {
      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(btn => btn.disabled = true);

      socket.emit('submitAnswer', { optionIndex: index });
    }

    // 4. รับผลลัพธ์ย่อยหลังตอบ
    socket.on('answerResult', (data) => {
      resultBox.innerText = '💡 ' + data.fitFor;
      resultBox.classList.remove('hidden');

      setTimeout(() => {
        quizModal.style.display = 'none';
        isQuizActive = false;
        answeredCount++;
        document.getElementById('zombieCount').innerText = answeredCount;

        if (answeredCount < 20) {
          spawnZombie();
        }
      }, 1500);
    });

    // 5. รับผลสรุปจัดอันดับเมื่อครบ 20 ข้อ
    socket.on('showFinalRanking', (stats) => {
      isQuizActive = true;
      quizModal.style.display = 'none';
      finalModal.style.display = 'flex';
      rankingContainer.innerHTML = '';

      const sortedStats = Object.entries(stats).sort((a, b) => b[1] - a[1]);

      sortedStats.forEach(([optionText, count], rank) => {
        const item = document.createElement('div');
        item.className = 'ranking-item';
        item.innerHTML = `<span><strong>อันดับ ${rank + 1}:</strong> ${optionText}</span><span><strong>${count}</strong> คน</span>`;
        rankingContainer.appendChild(item);
      });
    });

    // Loop วาดกราฟิกเกม
    function update() {
      if (isQuizActive) return;

      if ((keys['ArrowUp'] || keys['w']) && player.y > player.size) player.y -= player.speed;
      if ((keys['ArrowDown'] || keys['s']) && player.y < canvas.height - player.size) player.y += player.speed;
      if ((keys['ArrowLeft'] || keys['a']) && player.x > player.size) player.x -= player.speed;
      if ((keys['ArrowRight'] || keys['d']) && player.x < canvas.width - player.size) player.x += player.speed;

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (currentZombie) {
          const dist = Math.hypot(b.x - currentZombie.x, b.y - currentZombie.y);
          if (dist < currentZombie.size) {
            bullets.splice(i, 1);
            showQuiz();
            break;
          }
        }

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // วาดตัวละคร
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
      ctx.fill();

      // เส้นเป้าเล็ง
      ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(mousePos.x, mousePos.y);
      ctx.stroke();

      // กระสุน
      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // ซอมบี้
      if (currentZombie) {
        ctx.fillStyle = currentZombie.color;
        ctx.beginPath();
        ctx.arc(currentZombie.x, currentZombie.y, currentZombie.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(currentZombie.x - 7, currentZombie.y - 5, 3, 0, Math.PI * 2);
        ctx.arc(currentZombie.x + 7, currentZombie.y - 5, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
