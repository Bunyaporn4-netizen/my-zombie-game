<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Quiz Game - Play</title>
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #bb86fc;
      font-size: 1.3rem;
    }
    .progress {
      font-size: 0.9rem;
      color: #03dac6;
      margin-bottom: 15px;
    }
    .btn-option {
      background-color: #3700b3;
      color: white;
      border: none;
      padding: 14px 20px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-option:hover {
      background-color: #6200ee;
    }
    .btn-option:active {
      transform: scale(0.98);
    }
    .btn-option:disabled {
      background-color: #444;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #result-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #2c2c2c;
      border-left: 4px solid #03dac6;
      border-radius: 4px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #333;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="quiz-card">
    <div class="progress" id="progress-text">ข้อ 1 / 20</div>
    <h2 id="question-title">กำลังโหลดคำถาม...</h2>
    <div id="options-container"></div>
    <div id="result-box" class="hidden"></div>
  </div>

  <div class="card hidden" id="final-card">
    <h2>สรุปผลอันดับคำตอบยอดนิยม</h2>
    <div id="ranking-container"></div>
    <button onclick="location.reload()" class="btn-option" style="background-color: #03dac6; color: #000; font-weight: bold; margin-top: 20px;">
      🔄 เล่นใหม่อีกครั้ง
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let allQuestions = [];
    let currentIndex = 0;

    const quizCard = document.getElementById('quiz-card');
    const finalCard = document.getElementById('final-card');
    const progressText = document.getElementById('progress-text');
    const questionTitle = document.getElementById('question-title');
    const optionsContainer = document.getElementById('options-container');
    const resultBox = document.getElementById('result-box');
    const rankingContainer = document.getElementById('ranking-container');

    // 1. รับคำถามทั้งหมดจาก Server
    socket.on('initQuestions', (questions) => {
      allQuestions = questions;
      currentIndex = 0;
      renderQuestion(currentIndex);
    });

    // 2. แสดงคำถามตามลำดับ Index
    function renderQuestion(index) {
      resultBox.classList.add('hidden');
      resultBox.innerText = '';
      optionsContainer.innerHTML = '';

      const q = allQuestions[index];
      progressText.innerText = `ข้อ ${index + 1} / ${allQuestions.length}`;
      questionTitle.innerText = q.title;

      q.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt);
        optionsContainer.appendChild(btn);
      });
    }

    // 3. เมื่อผู้เล่นกดเลือกตัวเลือก
    function selectOption(option) {
      // ปิดใช้งานปุ่มทั้งหมดชั่วคราว
      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(btn => btn.disabled = true);

      // ส่งคำตอบให้ Server นับสถิติ
      socket.emit('submitAnswer', { optionText: option.text });

      // แสดงความเหมาะสม (fitFor)
      resultBox.innerText = '💡 ' + option.fitFor;
      resultBox.classList.remove('hidden');

      // รอ 2 วินาทีแล้วเปลี่ยนไปข้อถัดไปอัตโนมัติ
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < allQuestions.length) {
          renderQuestion(currentIndex);
        } else {
          // เล่นครบ 20 ข้อแล้ว ให้ขอผลสรุป
          socket.emit('getFinalRanking');
        }
      }, 2000);
    }

    // 4. แสดงผลสรุปเมื่อเล่นจบ 20 ข้อ
    socket.on('showFinalRanking', (stats) => {
      quizCard.classList.add('hidden');
      finalCard.classList.remove('hidden');
      rankingContainer.innerHTML = '';

      const sortedStats = Object.entries(stats).sort((a, b) => b[1] - a[1]);

      if (sortedStats.length === 0) {
        rankingContainer.innerHTML = '<p>ยังไม่มีข้อมูลสถิติ</p>';
        return;
      }

      sortedStats.forEach(([optionText, count], rank) => {
        const item = document.createElement('div');
        item.className = 'ranking-item';
        item.innerHTML = `<span><strong>อันดับ ${rank + 1}:</strong> ${optionText}</span><span><strong>${count}</strong> ครั้ง</span>`;
        rankingContainer.appendChild(item);
      });
    });
  </script>
</body>
</html>
